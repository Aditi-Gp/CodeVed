# Docker Compose configuration for local development and testing
# Production deployment should use AWS ECS, EKS, or similar

version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: algou-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-algou}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - algou-network

  # Backend Service (Code Execution)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algou-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      EXECUTION_TIMEOUT: ${EXECUTION_TIMEOUT:-10000}
      MEMORY_LIMIT: ${MEMORY_LIMIT:-268435456}
      MAX_OUTPUT_SIZE: ${MAX_OUTPUT_SIZE:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
    volumes:
      - backend_codes:/app/codes
      - backend_inputs:/app/inputs
      - backend_outputs:/app/outputs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - algou-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Server Service (API & Auth)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: algou-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://admin:changeme@mongodb:27017/algou?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-500}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - algou-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algou-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000}
    depends_on:
      - backend
      - server
    networks:
      - algou-network

volumes:
  mongodb_data:
    driver: local
  backend_codes:
    driver: local
  backend_inputs:
    driver: local
  backend_outputs:
    driver: local

networks:
  algou-network:
    driver: bridge





